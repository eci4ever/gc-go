name: gc-go

services:
  migrate:
    image: ghcr.io/eci4ever/gc-go-api:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - platform
    restart: "no"

  api:
    image: ghcr.io/eci4ever/gc-go-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: gc-go-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_URL: https://vms.nimfi.dev
      COOKIE_SECURE: "true"
      LISTEN_ADDR: :3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-GC Go <onboarding@resend.dev>}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - platform
    mem_limit: 96m
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  platform:
    external: true
    name: platform
