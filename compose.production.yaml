name: gc-go

services:
  postgres:
    image: postgres:18-alpine
    container_name: gc-go-postgres
    environment:
      POSTGRES_DB: gcgo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ghcr.io/eci4ever/gc-go-api:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/gcgo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/eci4ever/gc-go-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: gc-go-api
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/gcgo?sslmode=disable
      APP_URL: https://vms.nimfi.dev
      COOKIE_SECURE: "true"
      LISTEN_ADDR: :3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-GC Go <onboarding@resend.dev>}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/eci4ever/gc-go-web:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: gc-go-web
    environment:
      SITE_ADDRESS: vms.nimfi.dev
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
