name: gc-go

services:
  postgres:
    image: postgres:18-alpine
    container_name: gc-go-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: gcgo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
